<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="ReAil — realtime Three.js to SDXL-Turbo image-to-image experiment.">
  <title>ReAil</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="wordmark">Re<span>AI</span>l</div>
      <div class="connection-state"><span id="ai-badge" class="status">OFFLINE</span></div>
    </header>

    <main class="main">
      <div class="viewer-grid">
        <section class="viewer">
          <div class="viewer-bar">
            <span>THREE.JS</span>
            <span id="scene-fps">-- FPS</span>
          </div>
          <div class="viewport" id="scene-viewport">
            <canvas id="scene-canvas" aria-label="Sliceable grey sphere"></canvas>
            <canvas id="stroke-canvas" aria-hidden="true"></canvas>
            <div class="scene-hint" id="scene-hint">DRAG TO SLICE</div>
            <div class="corner" id="mesh-count">01 MESH</div>
          </div>
        </section>

        <section class="viewer">
          <div class="viewer-bar">
            <span>SDXL-TURBO</span>
            <span id="ai-latency">-- MS</span>
            <span id="ai-fps">-- FPS</span>
          </div>
          <div class="viewport output-viewport">
            <canvas id="ai-canvas" width="384" height="384" aria-label="SDXL-Turbo output"></canvas>
            <div class="ai-overlay" id="ai-overlay">
              <div class="loading-spinner"></div>
              <b id="overlay-title">OFFLINE</b>
              <span id="overlay-sub">Start the diffusion server or connect below.</span>
            </div>
            <div class="ai-telemetry" id="ai-telemetry" hidden>
              <span>STR <b id="stat-strength">—</b></span>
              <span>STEP <b id="stat-steps">—</b></span>
              <span>MOVE <b id="stat-motion">—</b></span>
              <span>GPU <b id="stat-gpu">—</b></span>
              <span>RES <b id="stat-resolution">—</b></span>
              <span>SERVER <b id="stat-server">—</b></span>
              <span>SKIPPED <b id="stat-skipped">0</b></span>
            </div>
          </div>
        </section>
      </div>

      <section class="controls">
        <div class="control-block interaction">
          <label>VIEW</label>
          <div class="button-row">
            <button id="tool-slice" class="button active" type="button">SLICE</button>
            <button id="tool-orbit" class="button" type="button">ORBIT</button>
            <button id="reset" class="button" type="button">RESET</button>
          </div>
        </div>

        <div class="control-block connection">
          <label for="socket-url">SERVER</label>
          <div class="input-row">
            <input id="socket-url" value="ws://127.0.0.1:8765/ws">
            <button id="connect" class="button primary" type="button">CONNECT</button>
          </div>
        </div>

        <div class="control-block prompt-block">
          <label for="prompt">PROMPT</label>
          <input id="prompt" value="Photorealistic smooth matte grey sphere, preserve exact silhouette and orientation, lighter grey solid interior where sliced, natural studio lighting, stable object identity">
        </div>

        <div class="control-block">
          <label for="inference-resolution">AI RESOLUTION <strong id="resolution-label">384²</strong></label>
          <select id="inference-resolution" title="Actual SDXL GPU input and output size">
            <option value="256">256 × 256 — FAST</option>
            <option value="384" selected>384 × 384 — BALANCED</option>
            <option value="512">512 × 512 — QUALITY</option>
          </select>
        </div>

        <div class="control-block">
          <label for="rate">RATE <strong id="rate-label">10 FPS</strong></label>
          <input id="rate" type="range" min="1" max="30" value="10">
          <label class="check" title="Avoid GPU inference when the Three.js image has barely changed">
            <input id="skip-still" type="checkbox" checked> SKIP UNCHANGED
          </label>
        </div>

        <div class="control-block">
          <label for="rotation">ROTATION <strong id="rotation-label">0.28</strong></label>
          <input id="rotation" type="range" min="0" max="150" value="28">
          <label class="check"><input id="auto-rotate" type="checkbox" checked> AUTO</label>
        </div>

        <div class="control-block">
          <label for="diffusion-strength">TRANSFORM <strong id="diffusion-strength-label">0.50</strong></label>
          <input id="diffusion-strength" type="range" min="13" max="100" value="50">
        </div>

        <div class="control-block">
          <label for="diffusion-steps">STEPS <strong id="diffusion-steps-label">2</strong></label>
          <input id="diffusion-steps" type="range" min="1" max="8" step="1" value="2">
        </div>

        <div class="control-block">
          <label for="temporal-stability">STABILITY <strong id="temporal-stability-label">42%</strong></label>
          <input id="temporal-stability" type="range" min="0" max="90" value="42">
          <label class="check" title="Use the smaller SDXL autoencoder. Faster, but lower image fidelity; first use downloads extra weights.">
            <input id="fast-vae" type="checkbox"> FAST VAE
          </label>
        </div>

        <div class="control-block">
          <label for="motion-response">MOTION <strong id="motion-response-label">1.00×</strong></label>
          <input id="motion-response" type="range" min="0" max="200" value="100">
        </div>

        <div class="control-block seed-block">
          <label for="diffusion-seed">SEED</label>
          <div class="input-row">
            <input id="diffusion-seed" type="number" min="0" max="2147483647" value="1337">
            <button id="randomize-seed" class="button" type="button">RANDOM</button>
          </div>
          <label class="check"><input id="lock-seed" type="checkbox" checked> LOCK</label>
        </div>

        <div class="control-block memory-block">
          <label>MEMORY</label>
          <button id="reset-ai-memory" class="button" type="button">RESET AI MEMORY</button>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./src.js"></script>
</body>
</html>
